<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Li Yi Hang Learning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark">LY</div>
        <div>
          <strong>Li Yi Hang</strong>
          <small>Learning Academy</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <a href="index.html" class="secondary-btn">Back home</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p class="subtle">Start your learning journey with a personal dashboard and course progress tracking.</p>
      <form id="registrationForm" class="form-grid">
        <div>
          <label for="registerName">Full name</label>
          <input id="registerName" type="text" placeholder="Your full name" required />
        </div>
        <div>
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label>Study focus</label>
          <select>
            <option>IT Courses</option>
            <option>Web Design</option>
            <option>AI Courses</option>
            <option>HSK 1</option>
            <option>HSK 2</option>
          </select>
        </div>
        <div>
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" minlength="6" placeholder="Create a password" required />
        </div>
        <button type="submit" class="primary-btn" style="width:100%;">Create account</button>
        <a href="placement.html" class="secondary-btn" style="text-align:center;">Take placement test first</a>
        <p id="registrationFeedback" class="subtle" aria-live="polite"></p>
      </form>
      <p style="margin-top:20px; text-align:center;">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="platform-portal.js"></script>
</body>
</html>
