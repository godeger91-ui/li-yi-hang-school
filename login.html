<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Li Yi Hang Learning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark">LY</div>
        <div>
          <strong>Li Yi Hang</strong>
          <small>Learning Academy</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <a href="index.html" class="secondary-btn">Back home</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-box">
      <h2>Welcome back</h2>
      <p class="subtle">Sign in to continue learning and track your progress.</p>
      <form id="loginForm" class="form-grid">
        <div>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="primary-btn" style="width:100%;">Login</button>
        <button type="button" id="googleDemo" class="secondary-btn" style="width:100%;">Continue with Google</button>
        <p id="loginFeedback" class="subtle" aria-live="polite"></p>
      </form>
      <p style="margin-top:20px; text-align:center;">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="platform-portal.js"></script>
</body>
</html>
